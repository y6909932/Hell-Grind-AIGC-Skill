name: adoption-windows-validation

on:
  push:
    branches:
      - chore/adopt-web-ci-dev-base-v0.1

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pytest for development validation
        run: python -m pip install pytest
      - name: Run generated read-only local runner
        shell: powershell
        run: .\scripts\run-local-tests.ps1
