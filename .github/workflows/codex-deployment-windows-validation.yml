name: codex-deployment-windows-validation

on:
  push:
    branches:
      - feat/codex-native-deployment-v0.1

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate install update status and drift protection
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "codex-skills"

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deployment\codex\install.ps1 -DestinationRoot $dest -SkipRemoteCheck
          if ($LASTEXITCODE -ne 0) { throw "first install failed: $LASTEXITCODE" }

          $target = Join-Path $dest "hell-grind-aigc-skill"
          if (-not (Test-Path (Join-Path $target "SKILL.md"))) { throw "SKILL.md missing after install" }
          if (-not (Test-Path (Join-Path $target "agents\openai.yaml"))) { throw "openai.yaml missing after install" }
          if (-not (Test-Path (Join-Path $target ".hell-grind-deployment.json"))) { throw "deployment manifest missing" }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deployment\codex\install.ps1 -DestinationRoot $dest -SkipRemoteCheck
          if ($LASTEXITCODE -eq 0) { throw "second install should fail closed" }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deployment\codex\status.ps1 -DestinationRoot $dest -SkipRemoteCheck
          if ($LASTEXITCODE -ne 0) { throw "status should be current: $LASTEXITCODE" }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deployment\codex\update.ps1 -DestinationRoot $dest -SkipRemoteCheck
          if ($LASTEXITCODE -ne 0) { throw "idempotent update failed: $LASTEXITCODE" }

          Add-Content -Path (Join-Path $target "SKILL.md") -Value "`nlocal drift for test"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deployment\codex\update.ps1 -DestinationRoot $dest -SkipRemoteCheck
          if ($LASTEXITCODE -eq 0) { throw "update should reject local drift" }

          $tail = Get-Content (Join-Path $target "SKILL.md") -Tail 1
          if ($tail -ne "local drift for test") { throw "drifted file was overwritten" }

          Write-Host "PASS: Codex deployment install/update/status/drift protection"
